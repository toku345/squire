name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      LANG: C.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config python3

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: ocaml-base-compiler.5.4.1
          opam-pin: false
          cache: false

      - name: Install locked opam dependencies
        run: |
          test -s squire.opam.locked
          opam install . --deps-only --locked --yes

      - name: Build install targets
        run: opam exec -- dune build --profile dev @install

      - name: Run tests
        run: opam exec -- dune runtest --profile dev --force

      - name: Check formatting
        run: opam exec -- dune build --profile dev @fmt
